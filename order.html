<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page - Flower Shop</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
        function validateAndSubmit() {
            var clientName = document.getElementById("customerName").value;
            
            if (clientName === "") {
                window.alert("Please enter your full name before submitting!");
                return false;
            } else {
                window.alert("Thank you, " + clientName + "! Your flower order has been successfully placed.");
                return true;
            }
        }
    </script>
</head>
<body>

    <header>
        <h1>Flower Shop Menu & Orders</h1>
    </header>

    <div class="nav-container">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="order.html" class="nav-btn">Order Form</a>
        <a href="index.html" class="nav-btn">About Us</a>
        <a href="index.html" class="nav-btn">Contact</a>
    </div>

    <main>
        <section class="content-box">
            <h2>Order Your Flower Bouquet</h2>
            <p>Please fill out the form below to complete your order:</p>
            
            <form onsubmit="return validateAndSubmit();">
                <div style="margin-bottom: 15px;">
                    <label>Full Name:</label><br>
                    <input type="text" id="customerName" placeholder="Enter your name here" style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label>Select Bouquet:</label><br>
                    <select style="width: 100%; padding: 8px; margin-top: 5px;">
                        <option>Luxury Red Roses</option>
                        <option>White Tulips Bouquet</option>
                        <option>Mixed Pastel Flowers</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label>Additional Notes:</label><br>
                    <textarea placeholder="Any special requests or gift card notes..." style="width: 100%; padding: 8px; margin-top: 5px; height: 80px;"></textarea>
                </div>

                <button type="submit" class="nav-btn" style="background-color: #d4a373; color: white; border: none; cursor: pointer; width: 100%; padding: 10px;">Submit Order</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Fresh Flowers, Happy Moments!</p>
    </footer>

</body>
</html>
